name: Fuzz
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./cel
            target: FuzzDecodeToCEL
          - pkg: ./cel
            target: FuzzTLVUnmarshalBinary
          - pkg: ./tcg
            target: FuzzParseEventLog
          - pkg: ./tpmeventlog
            target: FuzzReplayAndExtract
          - pkg: ./ccel
            target: FuzzCCELReplayAndExtract
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable
      - name: Run Go Fuzz (${{ matrix.target }})
        run: go test ${{ matrix.pkg }} -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=30s
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
